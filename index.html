<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Visor 3D Ojo Anatómico</title>
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
      "three/examples/jsm/loaders/DRACOLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js",
      "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }

    #info-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 300px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 16px;
      border-radius: 6px;
    }
    #info-panel h2 {
      margin-top: 0;
      font-size: 1.1em;
      color: #90caf9;
    }
  </style>
</head>
<body>
  <div id="info-panel">
    <h2>Información Anatómica</h2>
    <p><strong>Nombre:</strong> <span id="part-name">-</span></p>
    <p><strong>Descripción:</strong> <span id="part-desc">-</span></p>
    <p><strong>Procedimientos:</strong> <span id="conteo-proc">-</span></p>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/examples/jsm/loaders/DRACOLoader.js";
    import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // Mapas de descripción
    const descriptions = {
      "A1_Cristalino": "Lente natural del ojo. Puede desarrollar cataratas.",
      "A3_Cornea": "Capa transparente frontal. Protege y enfoca la luz.",
      "A5_Iris": "Regula la cantidad de luz que entra al ojo.",
      "A2_Glaucoma": "Relacionado con la presión ocular.",
      "A6_Conjuntiva": "Membrana que recubre el ojo. Se inflama en la conjuntivitis.",
      "B2_Esclera": "Parte blanca del ojo. Proporciona estructura.",
      "B1_Vitrectomia": "Área quirúrgica del humor vítreo.",
      "D_Refractiva_Corneal_Laser": "Zona intervenida por cirugía láser.",
      "E_Estrabismo": "Asociada al alineamiento muscular del ojo.",
      "H_OculoEstetica": "Área estética periocular.",
      "C_Oculo-plastica": "Relacionado con cirugía reconstructiva ocular.",
      "A4_Combinadas": "Incluye estructuras múltiples.",
      "B3_Combinadas": "Área compuesta por varias secciones."
    };

    const nameEl = document.getElementById("part-name");
    const descEl = document.getElementById("part-desc");
    const conteoEl = document.getElementById("conteo-proc");

    // Leer CSV de GitHub y armar mapa de conteos
    const procedureCounts = {};

    fetch("https://raw.githubusercontent.com/carlosraulardila/visor-ojo-3d/main/Hechos_CEM.csv")
      .then(res => res.text())
      .then(text => {
        const rows = text.trim().split("\n");
        const headers = rows[0].split(",");
        const claseIdx = headers.indexOf("Clase de Procedimiento");

        for (let i = 1; i < rows.length; i++) {
          const cols = rows[i].split(",");
          const clase = cols[claseIdx]?.trim().replace(/ /g, "_");
          if (clase) {
            procedureCounts[clase] = (procedureCounts[clase] || 0) + 1;
          }
        }
      });

    // Cargar modelo
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    let highlighted = null;
    let originalMaterial = null;

    loader.load('Ojo_nuevo.glb', gltf => {
      const model = gltf.scene;
      scene.add(model);

      model.traverse(child => {
        if (child.isMesh) {
          child.name = child.name.trim().replace(/ /g, "_");
          child.userData.originalMaterial = child.material.clone();
        }
      });

      animate();
    }, undefined, err => {
      console.error("Error al cargar:", err);
    });

    // Interacción
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = - (e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        const part = intersects[0].object;

        // Restaurar color anterior
        if (highlighted && originalMaterial) {
          highlighted.material = originalMaterial;
        }

        highlighted = part;
        originalMaterial = part.material;
        part.material = part.material.clone();
        part.material.color.set(0xff4444);

        const name = part.name;
        nameEl.textContent = name;
        descEl.textContent = descriptions[name] || "Sin descripción disponible.";
        conteoEl.textContent = procedureCounts[name] || 0;
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
