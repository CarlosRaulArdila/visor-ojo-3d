<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Visor 3D Ojo Anatómico</title>
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
      "three/examples/jsm/loaders/DRACOLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js",
      "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }

    #info-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 250px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px;
      border-radius: 6px;
    }

    #info-panel h2 {
      margin-top: 0;
      font-size: 1.1em;
      color: #90caf9;
    }
  </style>
</head>
<body>
  <div id="info-panel">
    <h2>Información anatómica</h2>
    <p><strong>Nombre:</strong> <span id="part-name">-</span></p>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/examples/jsm/loaders/DRACOLoader.js";
    import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

    const normalize = str => str.replace(/[.\s\-]/g, "_");

    const urlParams = new URLSearchParams(window.location.search);
    const parteSeleccionada = urlParams.get("parte");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    const nameEl = document.getElementById("part-name");

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    let highlighted = null;
    let originalMaterial = null;

    loader.load('Ojo_nuevo.glb', gltf => {
      const model = gltf.scene;
      scene.add(model);

      model.traverse(child => {
        if (child.isMesh) {
          child.name = child.name.trim();
          child.userData.originalMaterial = child.material.clone();

          if (parteSeleccionada && normalize(child.name) === parteSeleccionada) {
            highlighted = child;
            originalMaterial = child.material;
            child.material = child.material.clone();
            child.material.color.set(0xff4444);

            nameEl.textContent = child.name;
          }
        }
      });

      animate();
    }, undefined, err => {
      console.error("Error al cargar:", err);
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = - (e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        const part = intersects[0].object;

        if (highlighted && originalMaterial) {
          highlighted.material = originalMaterial;
        }

        highlighted = part;
        originalMaterial = part.material;
        part.material = part.material.clone();
        part.material.color.set(0xff4444);

        nameEl.textContent = part.name;
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
