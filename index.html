<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Visor 3D - Ojo Anatómico</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0,0,0,0.5);
        padding: 10px;
        font-family: sans-serif;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="info">Haz clic sobre una parte del ojo para ver su nombre</div>

    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
      import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
      import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x202020);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1, 3);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 10, 7.5);
      scene.add(dirLight);

      const loader = new GLTFLoader();
      let model = null;

      loader.load('Ojo_nuevo.glb', function(gltf) {
        model = gltf.scene;
        scene.add(model);

        // Mostrar los nombres de las partes en consola
        model.traverse((child) => {
          if (child.isMesh) {
            console.log("Parte:", child.name);
          }
        });

        animate();
      }, undefined, function(error) {
        console.error("Error al cargar el modelo:", error);
      });

      // Raycaster para clics
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const info = document.getElementById('info');

      function onClick(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(scene.children, true);

        if (intersects.length > 0) {
          const selected = intersects[0].object;
          info.textContent = `Parte seleccionada: ${selected.name || "Sin nombre"}`;
        }
      }

      window.addEventListener('click', onClick);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
