<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Modelo Anatómico del Ojo</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body {
        margin: 0;
        background-color: #000;
      }
      model-viewer {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <model-viewer
      src="Ojo_nuevo.glb"
      alt="Modelo 3D anatómico del ojo humano"
      auto-rotate
      camera-controls
      ar
      shadow-intensity="1"
      exposure="1"
    ></model-viewer>
  </body>
</html>
